--[[
  health.conf — compact desktop health strip
  Linux Mint 22.3 / Cinnamon, ThinkPad X1 Yoga Gen 6

  Shows CPU load + top CPU processes, memory + top RAM processes.
  Colour is the signal: green ok, amber watch, red act.

  Placement: pinned to head 0 (DP-3, 2560x1440) top-right.
  Top edge is panel-free, so gap_y is small.

  Tracked in ~/Software/dotfiles; ~/.config/conky/health.conf is a symlink.
  Launch: conky -c ~/.config/conky/health.conf
]]

conky.config = {
    -- window -------------------------------------------------------
    own_window = true,
    own_window_type = 'normal',
    own_window_class = 'Conky',
    own_window_title = 'conky-health',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 170,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    -- placement ----------------------------------------------------
    xinerama_head = 0,
    alignment = 'top_right',
    gap_x = 24,
    gap_y = 24,
    minimum_width = 400,
    maximum_width = 600,

    -- drawing ------------------------------------------------------
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    border_inner_margin = 8,
    border_outer_margin = 0,

    -- text ---------------------------------------------------------
    use_xft = true,
    font = 'DejaVu Sans Mono:size=11',
    override_utf8_locale = true,
    uppercase = false,
    short_units = true,
    pad_percents = 2,

    -- behaviour ----------------------------------------------------
    update_interval = 1.0,
    total_run_times = 0,
    double_buffer = true,
    no_buffers = true,
    cpu_avg_samples = 2,
    top_name_width = 14,
    text_buffer_size = 2048,

    -- palette ------------------------------------------------------
    default_color = 'D0D0D0',
    color1 = '7FB4CA',  -- accent / first row
    color2 = '8A8A8A',  -- dim labels
    color3 = '9ECE6A',  -- ok
    color4 = 'E0AF68',  -- watch
    color5 = 'F7768E',  -- act
}

conky.text = [[
${color2}UP${color}   ${uptime_short}
${color2}CPU${color}  ${if_match ${cpu cpu0}>85}${color5}${else}${if_match ${cpu cpu0}>60}${color4}${else}${color3}${endif}${endif}${cpu cpu0}%${color}${alignr}${color2}${loadavg 1}  ${loadavg 2}  ${loadavg 3}${color}
${if_match ${cpu cpu1}>85}${color5}${else}${if_match ${cpu cpu1}>60}${color4}${else}${color3}${endif}${endif}${cpubar cpu1 4,20} ${if_match ${cpu cpu2}>85}${color5}${else}${if_match ${cpu cpu2}>60}${color4}${else}${color3}${endif}${endif}${cpubar cpu2 4,20} ${if_match ${cpu cpu3}>85}${color5}${else}${if_match ${cpu cpu3}>60}${color4}${else}${color3}${endif}${endif}${cpubar cpu3 4,20} ${if_match ${cpu cpu4}>85}${color5}${else}${if_match ${cpu cpu4}>60}${color4}${else}${color3}${endif}${endif}${cpubar cpu4 4,20}
${if_match ${cpu cpu5}>85}${color5}${else}${if_match ${cpu cpu5}>60}${color4}${else}${color3}${endif}${endif}${cpubar cpu5 4,20} ${if_match ${cpu cpu6}>85}${color5}${else}${if_match ${cpu cpu6}>60}${color4}${else}${color3}${endif}${endif}${cpubar cpu6 4,20} ${if_match ${cpu cpu7}>85}${color5}${else}${if_match ${cpu cpu7}>60}${color4}${else}${color3}${endif}${endif}${cpubar cpu7 4,20} ${if_match ${cpu cpu8}>85}${color5}${else}${if_match ${cpu cpu8}>60}${color4}${else}${color3}${endif}${endif}${cpubar cpu8 4,20}
${color2}${execi 30 cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor}${color} · ${execpi 30 p=$(cat /sys/firmware/acpi/platform_profile); if [ "$p" = performance ]; then echo "\${color4}$p ⚠"; else echo "\${color3}$p"; fi}${color}

${color1}${top name 1}${alignr}${top cpu 1}%${color}
${top name 2}${alignr}${top cpu 2}%
${top name 3}${alignr}${top cpu 3}%
${top name 4}${alignr}${top cpu 4}%
${top name 5}${alignr}${top cpu 5}%
${top name 6}${alignr}${top cpu 6}%

${color2}MEM${color}  ${if_match ${memperc}>85}${color5}${else}${if_match ${memperc}>60}${color4}${else}${color3}${endif}${endif}${mem}${color} / ${memmax}${alignr}${memperc}%
${if_match ${memperc}>85}${color5}${else}${if_match ${memperc}>60}${color4}${else}${color3}${endif}${endif}${membar 3}${color}
${color2}SWAP${color} ${if_match ${swapperc}>50}${color5}${else}${if_match ${swapperc}>20}${color4}${else}${color3}${endif}${endif}${swap}${color} / ${swapmax}${alignr}${swapperc}%
${if_match ${swapperc}>50}${color5}${else}${if_match ${swapperc}>20}${color4}${else}${color3}${endif}${endif}${swapbar 3}${color}

${color1}${top_mem name 1}${alignr}${top_mem mem_res 1}${color}
${top_mem name 2}${alignr}${top_mem mem_res 2}
${top_mem name 3}${alignr}${top_mem mem_res 3}
${top_mem name 4}${alignr}${top_mem mem_res 4}
${top_mem name 5}${alignr}${top_mem mem_res 5}
${top_mem name 6}${alignr}${top_mem mem_res 6}
]]
